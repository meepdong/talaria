[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tnp-cli"
version = "0.0.1"
description = "Reference terminal client for the Talaria Node Protocol"
requires-python = ">=3.12"
dependencies = [
    "talaria-bridge",
    "websockets>=14",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
tnp-cli = "tnp_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tnp_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
