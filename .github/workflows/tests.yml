name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor in both pyproject.toml files; 3.13 catches forward drift.
        # Windows is kept because the pairing CLIs print emoji, and a console
        # encoding bug there once reduced the SAS to its six digits (see
        # docs/M0-plan.md).
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: "**/pyproject.toml"

      # One pip command, so tnp-cli's `talaria-bridge` dependency resolves to the
      # local editable install instead of being looked up on PyPI.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "bridge[test]" -e "tools/tnp-cli[test]"

      - name: Test
        run: python -m pytest bridge tools/tnp-cli -q

  gradle:
    name: client / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: client
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # core/session's integration tests run the Kotlin client against the real
      # Python bridge; TALARIA_PYTHON makes them fail instead of skip if it's missing.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the bridge for the integration tests
        working-directory: .
        run: |
          python -m pip install -e bridge
          echo "TALARIA_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      # core/protocol runs every file in spec/vectors, so the Kotlin client and the
      # Python bridge are checked against the same bytes.
      - name: Test
        run: ./gradlew check --console=plain

      # The desktop app as a folder with its own Java runtime (createDistributable).
      # Download it from the run's artifacts and start bin/Talaria or Talaria.exe.
      - name: Build the desktop app
        run: ./gradlew :desktopApp:createDistributable --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: talaria-desktop-${{ runner.os }}
          path: client/desktopApp/build/compose/binaries/main/app/
          if-no-files-found: error

      # The Android debug APK ("Talaria Debug"), signed with the repo's public debug key. The
      # unsigned release build is built too, so a tag never finds it broken (release.yml).
      - name: Build the Android app
        if: runner.os == 'Linux'
        run: ./gradlew :androidApp:assembleDebug :androidApp:assembleRelease --console=plain

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: talaria-android-debug
          path: client/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
