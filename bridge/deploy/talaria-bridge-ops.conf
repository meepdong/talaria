# Drop-in for talaria-bridge.service: lets the sandboxed bridge reach talaria-ops's socket.
# Install as /etc/systemd/system/talaria-bridge.service.d/20-ops.conf
[Unit]
After=talaria-ops.service
Wants=talaria-ops.service

[Service]
# "-": still start if talaria-ops is not installed (the bridge then simply offers no server operations).
ReadWritePaths=-/run/talaria-ops
