# Drop-in for talaria-bridge.service: the Files page's "Hermes workspace" (agents.json "files").
# ProtectHome=yes hid all of /home from the bridge, so the workspace showed "No such file or folder".
# Now /home is an empty tmpfs with only the agent's workspace bound in, read-only.
[Service]
ProtectHome=tmpfs
BindReadOnlyPaths=/home/hermes/projects
